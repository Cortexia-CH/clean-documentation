<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Card Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sweeper brush</h1>
  <div class="card">
    <h2 class="card-title">Sweeper brush</h2>
    <div class="image-text-container">
      <img src="assets/sweeper_brush_sample.png" alt="Image" class="card-image">
      <div class="card-content">
        <p>Rotating brushes with dense stiff bristles,  part of street-cleaning vehicle. Tag the brush head AND the mecanical arm.</p>
      </div>
    </div>
    <h3 style="text-align: center;">Real life example</h3>
    <img src="assets/sweeper_brush_1.jpg" alt="Big Image" class="big-image">
  </div>
</br>
</body>
</html>
