<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Card Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Graffitis</h1>
  <div class="card">
    <h2 class="card-title">Graffitis</h2>
    <div class="image-text-container">
      <img src="assets/graffitis_sample.png" alt="Image" class="card-image">
      <div class="card-content">
        <p>Sprayed/painted graffitis. Can be on walls or other surfaces (like dumpsters).
          <ul>
            <li>If several graffitis are overlapping, tag them <b>together</b> as a surface</li>
            <li>If graffitis are separated, tag them individually</li>
          </ul>
      </div>
    </div>
    <h3 style="text-align: center;">Real life example</h3>
    <img src="assets/graffitis_1.png" alt="Big Image" class="big-image">
    <img src="assets/graffitis_2.jpg" alt="Big Image" class="big-image">
  </div>
</br>
</body>
</html>
