<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Card Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Stains</h1>
  <div class="card">
    <h2 class="card-title">Stain (medium/big)</h2>
    <div class="image-text-container">
      <div class="card-content">
        <p>Stain of relevant size. Usually looks wet, greasy or strongly pigmented.</p>
      </div>
    </div>
    <h3 style="text-align: center;">Real life example</h3>
    <img src="assets/medium_big_stain_real.png" alt="Big Image" class="big-image">
  </div>

</body>
</html>
